services:
  gw2bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GW2_HOST_BRIDGE_ENABLED: ${GW2_HOST_BRIDGE_ENABLED:-true}
      GW2_CAPTURE_SOURCE: ${GW2_CAPTURE_SOURCE:-host}
      GW2_INPUT_SOURCE: ${GW2_INPUT_SOURCE:-host}
      GW2_DATA_DIR: ${GW2_DATA_DIR:-/app/data}
      GW2_TRAINING_AUTO_RETRAIN_ENABLED: ${GW2_TRAINING_AUTO_RETRAIN_ENABLED:-true}
      GW2_TRAINING_RETRAIN_INTERVAL_SECONDS: ${GW2_TRAINING_RETRAIN_INTERVAL_SECONDS:-300}
      GW2_RUNTIME_POLICY_ENABLED: ${GW2_RUNTIME_POLICY_ENABLED:-true}
      GW2_RUNTIME_INPUT_ENABLED: ${GW2_RUNTIME_INPUT_ENABLED:-true}
      GW2_RUNTIME_POLICY_MIN_CONFIDENCE: ${GW2_RUNTIME_POLICY_MIN_CONFIDENCE:-0.7}
      GW2_RUNTIME_SIGNAL_INTERVAL_MS: ${GW2_RUNTIME_SIGNAL_INTERVAL_MS:-1000}
      GW2_AUTOSTART_RUN_ENABLED: ${GW2_AUTOSTART_RUN_ENABLED:-true}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
