[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gw2bot"
version = "0.1.0"
description = "Containerized GW2 farming bot runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "numpy>=1.26.0,<3.0.0",
  "opencv-python>=4.9.0,<5.0.0",
  "ultralytics>=8.2.0,<9.0.0",
  "pyautogui>=0.9.54,<1.0.0",
  "pynput>=1.7.7,<2.0.0",
  "pillow>=10.0.0,<11.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-mock>=3.14.0,<4.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.5.0,<1.0.0",
  "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
gw2bot-retrain-scheduler = "src.cli.retrain_scheduler:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
